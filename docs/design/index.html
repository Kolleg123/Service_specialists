<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Свободно. — макеты 390 / 1280</title>
<style>body{font:15px system-ui;background:#f5f7f1;color:#203b2d;margin:0;padding:32px}h1{letter-spacing:-1px}p{max-width:900px;line-height:1.7;color:#607360}nav{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}select{font:inherit;padding:10px;border:1px solid #cbd7c3;border-radius:8px;background:white;color:#203b2d}label{display:grid;gap:8px;font-size:12px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}figure{margin:0;background:#fff;padding:16px;border:1px solid #dce4d6;border-radius:12px}figcaption{padding:0 0 12px;font-weight:600}img{display:block;width:100%;height:auto}a{color:#176b51}#note{padding:16px;background:#eaf1e0;border-radius:8px}main.mobile img{max-width:390px;margin:auto}@media(max-width:800px){body{padding:18px}main{grid-template-columns:1fr}}</style>
<h1>свободно. <small>Редизайн записи</small></h1><p>Макеты реализованного интерфейса на основе ai_version. Слева — исходный экран, справа — выбранное новое состояние. Изображение можно открыть в полном размере. Формы, цены и тексты взяты из работающего приложения.</p>
<nav><label>Ширина экрана<select id="width"><option>390</option><option>1280</option></select></label><label>Состояние<select id="state"><option value="catalog">Главная и каталог</option><option value="service">1. Услуга</option><option value="time">2. Дата и время</option><option value="confirmation">3. Подтверждение</option><option value="loading">Загрузка</option><option value="empty">Нет свободных дат</option><option value="error">Ошибка и повтор</option></select></label></nav>
<p id="note"></p><main><figure><figcaption>До · ai_version</figcaption><a id="before-link"><img id="before" alt="Экран до редизайна"></a></figure><figure><figcaption id="after-title">После</figcaption><a id="after-link"><img id="after" alt="Макет нового интерфейса"></a></figure></main><p><a href="README.md">Спецификация макетов, навигация и описание сценариев</a></p>
<script>const notes={catalog:'Поиск остаётся главным действием. Фото показывает услугу в процессе; помощник больше не перекрывает карточки.',service:'Первый этап: выбор услуги и раскрываемая информация о специалисте.',time:'Явные кнопки перехода по датам, календарное поле и продолжительность рядом со временем.',confirmation:'Перед записью видны услуга, дата, время, длительность, стоимость и итог.',loading:'Ответ API удержан тестом, чтобы воспроизвести состояние загрузки. После таймаута доступен повтор.',empty:'Тестовый ответ slots: []. Можно обновить расписание или выбрать другого специалиста.',error:'Тестовый HTTP 503. Кнопка повтора возвращает к реальному расписанию.'};function render(){const w=document.querySelector('#width').value,s=document.querySelector('#state').value;for(const kind of ['before','after']){const path=kind+'/'+(kind==='before'?(s==='catalog'?'catalog':'booking'):s)+'-'+w+'.png';document.querySelector('#'+kind).src=path;document.querySelector('#'+kind+'-link').href=path;}document.querySelector('main').className=w==='390'?'mobile':'';document.querySelector('#note').textContent=notes[s];document.querySelector('#after-title').textContent='После · '+w+' px';}document.querySelectorAll('select').forEach(x=>x.onchange=render);render();</script></html>
